[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-api"
version = "0.1.0"
description = "Product API Backend Service"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "SQLAlchemy>=2.0.0",
    "Flask-Migrate>=4.0.0",
    "marshmallow>=3.20.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
